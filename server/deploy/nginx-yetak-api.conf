server {
    listen 80;
    listen [::]:80;
    # AWS ichki manzili: ziyra-ichki shu manzilda default_server; nomimiz bo'yicha bizga keladi.
    listen 172.31.17.58:80;
    server_name yetak-api.diyorjon.com yetak-api.63-177-216-224.sslip.io;

    client_max_body_size 64k;

    # Hujjat yuklash: telefon rasmi 2-8 MB, server o'zi 10 MB gacha qabul qiladi.
    location ~ ^/api/sessions/[^/]+/hujjatlar/ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / { return 404; }
}
