name: server

# Faqat tekshiruv. Serverga joylash qo'lda: server/deploy/joylash.sh (jamoa qarori, 2026-11-17).
on:
  push:
    branches: [main]
    paths: ["server/**", "shared/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "shared/**", ".github/workflows/server.yml"]

jobs:
  tekshiruv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: server/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
