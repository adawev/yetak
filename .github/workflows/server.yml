name: server

on:
  push:
    branches: [main]
    paths: ["server/**", "shared/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "shared/**", ".github/workflows/server.yml"]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tekshiruv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: server/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist/index.js
          retention-days: 7

  joylash:
    needs: tekshiruv
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-dist
      - name: Serverga yuborish
        env:
          KALIT: ${{ secrets.YETAK_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.YETAK_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.YETAK_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KALIT" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes "yetak-deploy@$HOST" "${GITHUB_SHA}" < index.js
      - name: Tashqaridan tekshirish
        run: curl -sf -m 10 https://yetak-api.63-177-216-224.sslip.io/api/health
